<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Middelburg Pharmaceutical Facility — Environmental Monitoring</title>

  <!-- Inter via Google Fonts CDN; the system-font stack in --font-sans is the
       offline fallback if this link is blocked (no layout break). -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Vendored Leaflet CSS (primary copy, offline-safe). -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <!-- Application stylesheet. -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Header rendered once by app.js -->
  <header class="app-header"></header>

  <!-- Sidebar rendered once by app.js -->
  <nav class="app-sidebar" aria-label="Primary">
    <ul></ul>
  </nav>

  <!-- Overlay scrim for the mobile/tablet drawer -->
  <div class="scrim"></div>

  <!-- Main content area -->
  <main class="app-main">
    <div id="demo-banner-slot"></div>
    <div id="view"></div>
  </main>

  <!-- Vendored libraries loaded as classic globals so pages/components can use
       `L` (Leaflet) and `Chart` (Chart.js). Primary offline-safe copies under
       /vendor/. If either fails to load, the owning component degrades to its
       fallback (map fallback card / 'Chart library unavailable' block). -->
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/chart/chart.umd.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
